# Print the single-GPU pair the launch rule would pick. Does not launch.
# A push to feat/tensorboard-training resolves too. Auto picks the cheapest
# single-GPU pair, then the region closest to AWS us-west-1.
#
# Requires the repository secret LAMBDA_CLOUD_API_KEY:
#   gh secret set LAMBDA_CLOUD_API_KEY --repo kinetic-auto/lerobot

name: Lambda instance

on:
  push:
    branches:
      - feat/tensorboard-training
  workflow_dispatch:
    inputs:
      instance_type:
        description: gpu_1x_* type, or auto for the cheapest pair, then closest to AWS us-west-1
        type: string
        required: false
        default: auto
      region:
        description: Region, or empty for the closest region to AWS us-west-1 on the chosen type
        type: string
        required: false
        default: ""

# A second run waits. This job does not launch.
concurrency:
  group: lambda-instance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve instance
    runs-on: [self-hosted, X64, supertower]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Require Lambda API key
        env:
          LAMBDA_CLOUD_API_KEY: ${{ secrets.LAMBDA_CLOUD_API_KEY }}
        run: |
          if [[ -z "${LAMBDA_CLOUD_API_KEY}" ]]; then
            echo "error: repository secret LAMBDA_CLOUD_API_KEY is not set" >&2
            exit 1
          fi

      - name: Resolve instance type and region
        env:
          LAMBDA_CLOUD_API_KEY: ${{ secrets.LAMBDA_CLOUD_API_KEY }}
          INSTANCE_TYPE: ${{ inputs.instance_type || 'auto' }}
          REGION: ${{ inputs.region }}
        run: |
          set -euo pipefail
          ./scripts/lambda_cloud.sh resolve \
            --instance-type "${INSTANCE_TYPE}" \
            --region "${REGION}"
